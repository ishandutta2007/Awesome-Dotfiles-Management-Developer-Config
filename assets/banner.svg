<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="orb-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45" />
    </filter>

    <style>
      .terminal-cursor {
        animation: blink 1s infinite alternate;
      }
      @keyframes blink {
        0%, 40% { opacity: 1; }
        60%, 100% { opacity: 0; }
      }
      .orbit-particle {
        animation: float 6s ease-in-out infinite alternate;
      }
      @keyframes float {
        0% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-12px) scale(1.05); }
        100% { transform: translateY(0px) scale(1); }
      }
      .pulse-ring {
        animation: pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      .badge-pill {
        transition: transform 0.2s ease;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)"/>

  <!-- Background Decorative Grid -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="500" y1="0" x2="500" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="700" y1="0" x2="700" y2="420"/>
    <line x1="800" y1="0" x2="800" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1000" y1="0" x2="1000" y2="420"/>
    <line x1="1100" y1="0" x2="1100" y2="420"/>
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
  </g>

  <!-- Glowing background orbs (deep under text) -->
  <g class="orbit-particle">
    <circle cx="180" cy="110" r="90" fill="#0284c7" opacity="0.18" filter="url(#orb-blur)"/>
    <circle cx="1020" cy="300" r="110" fill="#7c3aed" opacity="0.18" filter="url(#orb-blur)"/>
    <circle cx="950" cy="90" r="75" fill="#06b6d4" opacity="0.15" filter="url(#orb-blur)"/>
  </g>

  <!-- Dynamic Animated Ambient Node Connections (Background decorative) -->
  <g opacity="0.25">
    <circle cx="1060" cy="120" r="4" fill="#38bdf8" />
    <circle cx="940" cy="160" r="5" fill="#818cf8" />
    <circle cx="1120" cy="220" r="3.5" fill="#c084fc" />
    <circle cx="1010" cy="270" r="4.5" fill="#38bdf8" />
    <line x1="1060" y1="120" x2="940" y2="160" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="940" y1="160" x2="1010" y2="270" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="1060" y1="120" x2="1120" y2="220" stroke="#c084fc" stroke-width="1.5"/>
  </g>

  <!-- Decorative Modern Terminal Card on the Right (Foreground background element) -->
  <g transform="translate(790, 85)" class="orbit-particle">
    <rect width="360" height="230" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <!-- Terminal header -->
    <rect width="360" height="32" rx="12" fill="#0f172a" opacity="0.9"/>
    <circle cx="20" cy="16" r="5" fill="#ef4444"/>
    <circle cx="36" cy="16" r="5" fill="#eab308"/>
    <circle cx="52" cy="16" r="5" fill="#22c55e"/>
    <text x="180" y="21" fill="#64748b" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" text-anchor="middle">~/.config/dotfiles</text>
    
    <!-- Code lines -->
    <text x="24" y="66" fill="#38bdf8" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13">$ chezmoi init --apply</text>
    <text x="24" y="94" fill="#10b981" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13">✓ ~/.zshrc synchronized</text>
    <text x="24" y="122" fill="#10b981" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13">✓ ~/.config/nvim linked</text>
    <text x="24" y="150" fill="#10b981" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13">✓ age encryption verified</text>
    <text x="24" y="182" fill="#f59e0b" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13">🚀 12 machines declarative sync</text>
    <text x="24" y="210" fill="#e2e8f0" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13">$ echo "Developer Environment Ready"<tspan class="terminal-cursor" fill="#38bdf8">_</tspan></text>
  </g>

  <!-- FOREGROUND TEXT SECTION (Guaranteed crisp and unobstructed) -->
  <!-- Top Category Tag -->
  <g transform="translate(70, 75)">
    <rect width="265" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="16" cy="15" r="4.5" fill="#38bdf8" class="pulse-ring"/>
    <text x="30" y="19.5" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" letter-spacing="1.2">CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- Main Title -->
  <text x="70" y="160" fill="url(#text-grad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="46" letter-spacing="-1.2">
    Awesome Dotfiles
  </text>
  <text x="70" y="210" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="34" letter-spacing="-0.8">
    &amp; Developer Config Management
  </text>

  <!-- Subtitle -->
  <text x="72" y="254" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="16.5">
    The ultimate curated index of SaaS cloud dev environments, dotfile orchestrators,
  </text>
  <text x="72" y="278" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="16.5">
    declarative state managers, symlink engines, and self-hosted bootstrap toolkits.
  </text>

  <!-- Dynamic Feature Badges / Pills -->
  <g transform="translate(70, 325)">
    <!-- Pill 1 -->
    <g class="badge-pill">
      <rect width="135" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <text x="67.5" y="21.5" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" text-anchor="middle">⚡ Declarative Sync</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(147, 0)" class="badge-pill">
      <rect width="138" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <text x="69" y="21.5" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" text-anchor="middle">🔒 Secret Vaults</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(297, 0)" class="badge-pill">
      <rect width="148" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <text x="74" y="21.5" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" text-anchor="middle">☁️ Cloud Sandboxes</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(457, 0)" class="badge-pill">
      <rect width="158" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <text x="79" y="21.5" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" text-anchor="middle">🛠️ Symlink Engines</text>
    </g>
  </g>

  <!-- Subtle bottom border highlight -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#glow-cyan)" rx="2"/>
</svg>
